schema: sputnik.build.v1
name: sputnik.bench.polyglot.http_rps_server
root: sputnik.bench.polyglot.http_rps_server

profiles:
  required: [core.v1, ffi.v1, macro.v1]
  optional: []
  forbidden: []

modules:
  - name: sqlite3
    path: ../../../../orbit/.build/dependencies/sqlite3/src/sqlite3.s
  - name: orm
    path: ../../../../orbit/.build/dependencies/orm/src/orm.s
  - name: orm.pool
    path: ../../../../orbit/.build/dependencies/orm/src/orm/pool.s
  - name: orm.sqlite3.adapter
    path: ../../../../orbit/.build/dependencies/orm/src/orm/sqlite3/adapter.s
  - name: orm.sqlite3.pool
    path: ../../../../orbit/.build/dependencies/orm/src/orm/sqlite3/pool.s
  - name: orm.sqlite3
    path: ../../../../orbit/.build/dependencies/orm/src/orm/sqlite3.s
  - name: orbit
    path: ../../../../orbit/src/orbit.s
  - name: orbit.telemetry
    path: ../../../../orbit/src/orbit/telemetry.s
  - name: orbit.integrations.orm
    path: ../../../../orbit/packages/orbit-orm/src/orbit/integrations/orm.s
  - name: sputnik.bench.polyglot.http_rps_server
    path: http_rps_server.s

native_extensions:
  - name: sqlite3
    language: c
    sources:
      - ../../../../orbit/.build/dependencies/sqlite3/native/sqlite3_ext.c
      - ../../../../orbit/.build/dependencies/sqlite3/native/sqlite3.c
    headers:
      - ../../../../orbit/.build/dependencies/sqlite3/native/sqlite3.h
    blocking_symbols:
      - amsq_pool_acquire_wait
    defines:
      - SQLITE_THREADSAFE=1
      - SQLITE_ENABLE_COLUMN_METADATA=1
      - SQLITE_ENABLE_FTS5=1
      - SQLITE_ENABLE_JSON1=1
      - SQLITE_DQS=0
      - SQLITE_OMIT_LOAD_EXTENSION=1
